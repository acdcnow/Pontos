name: Check Version

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Read version from manifest.json
        id: read_version
        run: |
          version=$(jq -r '.version' custom_components/pontos/manifest.json)
          echo "version=$version" >> $GITHUB_ENV
          echo "Manifest version: $version"

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Tags are used with and without the "v" prefix, normalise them.
          latest_tag=$(git tag --sort=-v:refname | head -n1 | sed 's/^v//')
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV
          echo "Latest tag: ${latest_tag:-<none>}"

      - name: Fail if the version was lowered
        if: env.latest_tag != ''
        run: |
          version="${version#v}"
          sorted=$(printf '%s\n%s\n' "$latest_tag" "$version" | sort -V)
          if [ "$(printf '%s\n' "$sorted" | head -n1)" = "$version" ] \
             && [ "$version" != "$latest_tag" ]; then
            echo "::error::Version in manifest.json ($version) is lower than the latest tag ($latest_tag)."
            exit 1
          fi
          echo "Version $version is not lower than the latest tag $latest_tag."

      - name: Require a version bump when the integration changed
        if: env.latest_tag != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version="${version#v}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- custom_components; then
            echo "custom_components is unchanged, no version bump required."
            exit 0
          fi
          if [ "$version" = "$latest_tag" ]; then
            echo "::error::custom_components changed, but manifest.json still has version $version which is already released as tag $latest_tag. Please bump the version."
            exit 1
          fi
          echo "Version $version is newer than the latest tag $latest_tag."
