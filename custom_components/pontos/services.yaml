open_valve:
  name: Open valve
  description: Opens the water valve of the selected device.
  fields: &target_fields
    device_id:
      name: Device
      description: Device to send the command to. If omitted, the command is sent to all configured devices.
      required: false
      selector:
        device:
          integration: pontos
    entry_id:
      name: Config entry id
      description: Alternative way of targeting a single device by its config entry id.
      required: false
      selector:
        text:

close_valve:
  name: Close valve
  description: Closes the water valve of the selected device.
  fields: *target_fields

clear_alarms:
  name: Clear alarms
  description: Clears the alarms of the selected device.
  fields: *target_fields

clear_warnings:
  name: Clear warnings
  description: Clears the warnings of the selected device.
  fields: *target_fields

clear_notifications:
  name: Clear notifications
  description: Clears the notifications of the selected device.
  fields: *target_fields

enable_buzzer:
  name: Enable buzzer
  description: Enables the alarm buzzer of the selected device.
  fields: *target_fields

disable_buzzer:
  name: Disable buzzer
  description: Disables the alarm buzzer of the selected device.
  fields: *target_fields

microleakage_test:
  name: Start microleakage test
  description: Starts a microleakage test on the selected device.
  fields: *target_fields

start_self_study:
  name: Start self-study
  description: Starts the self-study phase used to determine the installation limits.
  fields:
    <<: *target_fields
    days:
      name: Duration
      description: Duration of the self-study phase in days (0-28).
      required: true
      selector:
        number:
          min: 0
          max: 28
          step: 1
          mode: box

delete_self_study:
  name: Delete self-study values
  description: Deletes the values determined during the self-study phase.
  fields: *target_fields

set_profile:
  name: Set profile
  description: Activates one of the profiles of the selected device.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number to activate (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box

set_profile_volume:
  name: Set profile volume
  description: Sets the permitted water volume of a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    volume:
      name: Volume
      description: Permitted volume in liters (0-9000).
      required: true
      selector:
        number:
          min: 0
          max: 9000
          step: 1
          mode: box
          unit_of_measurement: L

set_profile_time:
  name: Set profile time
  description: Sets the permitted water draw time of a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    minutes:
      name: Minutes
      description: Permitted time in minutes (0-1500).
      required: true
      selector:
        number:
          min: 0
          max: 1500
          step: 1
          mode: box
          unit_of_measurement: min

set_profile_flow:
  name: Set profile flow
  description: Sets the permitted flow rate of a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    flow:
      name: Flow
      description: Permitted flow rate in liters per hour (0-5000).
      required: true
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          mode: box
          unit_of_measurement: L/h

set_profile_return_time:
  name: Set profile return time
  description: Sets the time after which the device returns to a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    hours:
      name: Hours
      description: Return time in hours (0-700).
      required: true
      selector:
        number:
          min: 0
          max: 700
          step: 1
          mode: box
          unit_of_measurement: h

set_profile_availability:
  name: Set profile availability
  description: Enables or disables a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    enabled:
      name: Available
      description: Whether the profile can be selected on the device.
      required: true
      selector:
        boolean:

set_profile_warning:
  name: Set profile leakage warning
  description: Enables or disables the leakage warning of a profile.
  fields:
    <<: *target_fields
    profile:
      name: Profile
      description: Profile number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: box
    enabled:
      name: Warning enabled
      description: Whether the device warns when the profile limits are reached.
      required: true
      selector:
        boolean:

microleakage_schedule:
  name: Set microleakage test schedule
  description: Sets how often the device performs a microleakage test.
  fields:
    <<: *target_fields
    schedule:
      name: Schedule
      description: Interval of the microleakage test.
      required: true
      selector:
        select:
          options:
            - label: Daily
              value: "1"
            - label: Weekly
              value: "2"
            - label: Monthly
              value: "3"

microleakage_time:
  name: Set microleakage test time
  description: Sets the time of day at which the microleakage test is performed.
  fields:
    <<: *target_fields
    time:
      name: Time
      description: Time of day in HH:MM format.
      required: true
      selector:
        time:

set_regeneration_mode:
  name: Set regeneration mode
  description: Sets the regeneration mode of a NeoSoft device.
  fields:
    <<: *target_fields
    mode:
      name: Mode
      description: Regeneration mode.
      required: true
      selector:
        select:
          options:
            - label: Standard
              value: "1"
            - label: ECO
              value: "2"
            - label: Power
              value: "3"
            - label: Automatic
              value: "4"

set_regeneration_interval:
  name: Set regeneration interval
  description: Sets the number of days between two regenerations.
  fields:
    <<: *target_fields
    days:
      name: Days
      description: Number of days between regenerations (1-3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box

set_regeneration_time:
  name: Set regeneration time
  description: Sets the time of day at which the device regenerates.
  fields:
    <<: *target_fields
    time:
      name: Time
      description: Time of day in HH:MM format.
      required: true
      selector:
        time:

generic_service:
  name: Generic service call
  description: >-
    Sends a command to an arbitrary device endpoint. Only use this if you know
    the API of your device.
  fields:
    <<: *target_fields
    endpoint:
      name: Endpoint
      description: >-
        Endpoint to call on the device, for example "set/pv1" to change the
        permitted volume of profile 1.
      required: true
      selector:
        text:
    data:
      name: Data
      description: Value that is sent to the endpoint.
      required: true
      selector:
        text:
